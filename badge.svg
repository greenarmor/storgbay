  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="475" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="830" lengthAdjust="spacing">compliance</text>
    <text x="475" y="140" transform="scale(.1)" textLength="830" lengthAdjust="spacing">compliance</text>
    <text x="1300" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="580" lengthAdjust="spacing">92% (A)</text>
    <text x="1300" y="140" transform="scale(.1)" textLength="580" lengthAdjust="spacing">92% (A)</text>
