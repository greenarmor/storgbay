name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
      AUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
      S3_ACCESS_KEY: ${{ secrets.CI_S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.CI_S3_SECRET_KEY }}
      S3_ENDPOINT: https://ci.example.com
      S3_BUCKET: ci-test-bucket
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
